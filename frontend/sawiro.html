<!DOCTYPE html>
<html lang="so">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>📸 Sawirro</title>


    <style>

        /* ============================================================
           RESET
        ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ============================================================
           BODY
        ============================================================ */

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 20px;
            padding-bottom: 50px;
        }


        /* ============================================================
           CONTAINER
        ============================================================ */

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }


        /* ============================================================
           TITLE
        ============================================================ */

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 32px;
            color: white;
        }


        /* ============================================================
           SECTION TITLE
        ============================================================ */

        .section-title {
            color: #cbd5e1;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }


        /* ============================================================
           GALLERY
        ============================================================ */

        .gallery {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-top: 20px;
        }


        /* ============================================================
           CARD

           SAWIRKA = 450px
           TEXT = 100px
           TOTAL CARD = 550px

           SAWIRKA CABIRKIISA LAMA BEDDELIN
        ============================================================ */

        .card {
            width: 100%;
            height: 550px;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease;
        }


            .card:hover {
                transform: scale(1.02);
            }


            /* ============================================================
           IMAGE

           WIDTH = 100%
           HEIGHT = 450px

           SIDII CODE-KII HORE
        ============================================================ */

            .card img {
                width: 100%;
                height: 600px;
                min-height: 450px;
                max-height: 450px;
                object-fit: cover;
                object-position: center;
                display: block;
                flex: 0 0 450px;
                background: #0f172a;
            }


            /* ============================================================
           TEXT AREA

           WIDTH = 100%
           HEIGHT = 100px

           HALKAN TEXT-KU WUU SOO BAXAYAA
        ============================================================ */

            .card .text {
                width: 100%;
                height: 100px;
                min-height: 100px;
                max-height: 100px;
                padding: 10px 12px;
                background: #1e293b;
                color: white;
                display: block;
                flex: 0 0 100px;
                overflow: hidden;
            }


                /* ============================================================
           TITLE
        ============================================================ */

                .card .text h3 {
                    display: block;
                    width: 100%;
                    margin: 0 0 7px 0;
                    padding: 0;
                    color: white;
                    font-size: 18px;
                    font-weight: bold;
                    line-height: 1.3;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }


                /* ============================================================
           DESCRIPTION
        ============================================================ */

                .card .text p {
                    display: -webkit-box;
                    width: 100%;
                    margin: 0;
                    padding: 0;
                    color: #cbd5e1;
                    font-size: 14px;
                    line-height: 1.4;
                    -webkit-line-clamp: 3;
                    -webkit-box-orient: vertical;
                    overflow: hidden;
                }


        /* ============================================================
           ADMIN BUTTONS
        ============================================================ */

        .admin-buttons {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


            .admin-buttons button {
                border: none;
                padding: 8px 12px;
                border-radius: 6px;
                color: white;
                cursor: pointer;
                font-size: 14px;
            }


        /* ============================================================
           EDIT
        ============================================================ */

        .edit-btn {
            background: #2563eb;
        }


            .edit-btn:hover {
                background: #1d4ed8;
            }


        /* ============================================================
           DELETE
        ============================================================ */

        .delete-btn {
            background: #dc2626;
        }


            .delete-btn:hover {
                background: #b91c1c;
            }


        /* ============================================================
           BACK BUTTON
        ============================================================ */

        .back-link {
            display: block;
            width: 100%;
            margin-top: 30px;
            padding: 12px;
            text-align: center;
            color: white;
            background: #334155;
            text-decoration: none;
            border-radius: 8px;
        }


            .back-link:hover {
                background: #475569;
            }


        /* ============================================================
           LOGIN
        ============================================================ */

        .admin-login {
            margin-top: 30px;
            padding: 25px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 10px;
            text-align: center;
        }


            .admin-login h2 {
                margin-bottom: 10px;
                color: white;
            }


            .admin-login p {
                margin-bottom: 10px;
                color: #94a3b8;
                font-size: 14px;
            }


            .admin-login input {
                width: 60%;
                padding: 12px;
                border: none;
                border-radius: 6px;
                outline: none;
                font-size: 16px;
            }


            .admin-login button {
                padding: 12px 25px;
                margin-left: 5px;
                border: none;
                border-radius: 6px;
                background: #2563eb;
                color: white;
                cursor: pointer;
                font-size: 16px;
            }


                .admin-login button:hover {
                    background: #1d4ed8;
                }


        /* ============================================================
           ADMIN PANEL
        ============================================================ */

        .admin-panel {
            display: none;
            margin-top: 30px;
        }


        .admin {
            padding: 20px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 10px;
        }


        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }


            .admin-header h2 {
                color: white;
            }


        /* ============================================================
           ADMIN INPUTS
        ============================================================ */

        .admin input[type="text"],
        .admin textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }


        .admin textarea {
            min-height: 80px;
            resize: vertical;
        }


        .admin input[type="file"] {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: white;
            color: #111827;
            border-radius: 6px;
        }


        /* ============================================================
           UPLOAD BUTTON
        ============================================================ */

        .upload-btn {
            margin-top: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #16a34a;
            color: white;
            cursor: pointer;
        }


            .upload-btn:hover {
                background: #15803d;
            }


        /* ============================================================
           LOGOUT
        ============================================================ */

        .logout-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #dc2626;
            color: white;
            cursor: pointer;
        }


        /* ============================================================
           MESSAGE
        ============================================================ */

        .success-msg {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }


        /* ============================================================
           IMAGE PREVIEW MODAL
        ============================================================ */

        .image-preview-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
        }


        .preview-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }


            .preview-content img {
                width: auto;
                height: auto;
                max-width: 95vw;
                max-height: 90vh;
                object-fit: contain;
                display: block;
                border-radius: 10px;
            }


        /* ============================================================
           CLOSE PREVIEW
        ============================================================ */

        .close-preview {
            position: fixed;
            top: 15px;
            right: 30px;
            z-index: 1002;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }


            .close-preview:hover {
                color: #ef4444;
            }


        /* ============================================================
           PREVIEW INFO
        ============================================================ */

        .preview-info {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            z-index: 1001;
            width: auto;
            max-width: 80%;
            padding: 12px 25px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            text-align: center;
        }


            .preview-info h3 {
                margin-bottom: 5px;
                color: white;
            }


            .preview-info p {
                color: #cbd5e1;
                font-size: 14px;
            }


        /* ============================================================
           EDIT MODAL
        ============================================================ */

        .edit-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            overflow-y: auto;
        }


        .edit-modal-content {
            width: 90%;
            max-width: 500px;
            margin: 5% auto;
            padding: 25px;
            background: #1e293b;
            border-radius: 10px;
        }


        .close-modal {
            float: right;
            font-size: 28px;
            color: #94a3b8;
            cursor: pointer;
        }


            .close-modal:hover {
                color: white;
            }


        .edit-modal-content h2 {
            margin-bottom: 15px;
        }


        .edit-modal-content input,
        .edit-modal-content textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            outline: none;
        }


        .edit-modal-content textarea {
            min-height: 100px;
            resize: vertical;
        }


        .edit-modal-content input[type="file"] {
            background: white;
            color: #111827;
        }


        .edit-modal-content small {
            display: block;
            margin-top: 8px;
            color: #94a3b8;
        }


        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }


            .modal-buttons button {
                flex: 1;
                padding: 12px;
                border: none;
                border-radius: 6px;
                color: white;
                cursor: pointer;
            }


        .save-edit {
            background: #16a34a;
        }


        .cancel-edit {
            background: #64748b;
        }


        /* ============================================================
           MOBILE

           SAWIRKA = 450px
           TEXT = 100px
           CARD = 550px

           SAWIRKA CABIRKIISA LAMA BEDDELIN
        ============================================================ */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }


            .gallery {
                grid-template-columns: 1fr;
                gap: 15px;
            }


            .card {
                width: 100%;
                height: 550px;
                min-height: 550px;
            }


                .card img {
                    width: 100%;
                    height: 600px;
                    min-height: 450px;
                    max-height: 450px;
                    flex: 0 0 450px;
                    object-fit: cover;
                }


                .card .text {
                    width: 100%;
                    height: 100px;
                    min-height: 100px;
                    max-height: 100px;
                    flex: 0 0 100px;
                    padding: 10px;
                }


            .admin-login input {
                width: 100%;
                margin-bottom: 10px;
            }


            .admin-login button {
                width: 100%;
                margin-left: 0;
            }


            .admin-header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }


            .logout-btn {
                width: 100%;
            }


            .preview-info {
                width: 90%;
                max-width: 90%;
                bottom: 10px;
            }
        }
    </style>

</head>


<body>


    <div class="container">


        <!-- TITLE -->

        <h1>
            📸 Sawirro
        </h1>


        <!-- SECTION -->

        <div class="section-title">
            🖼️ Sawirrada
        </div>


        <!-- GALLERY -->

        <div class="gallery"
             id="gallery"></div>


        <!-- BACK -->

        <a href="index.html"
           class="back-link">

            ⬅️ Ku noqo bogga hore

        </a>


        <!-- ============================================================
             ADMIN LOGIN
        ============================================================ -->

        <div class="admin-login"
             id="loginSection">

            <h2>
                🔐 Admin Login
            </h2>

            <p>
                Geli password-ka si aad u maamusho sawirrada.
            </p>

            <input type="password"
                   id="passwordInput"
                   placeholder="Password">

            <button onclick="login()">
                Login
            </button>

        </div>


        <!-- ============================================================
             ADMIN PANEL
        ============================================================ -->

        <div class="admin-panel"
             id="adminPanel">

            <div class="admin">


                <div class="admin-header">

                    <h2>
                        📤 Soo geli Sawir
                    </h2>

                    <button class="logout-btn"
                            onclick="logout()">

                        Logout

                    </button>

                </div>


                <input type="text"
                       id="title"
                       placeholder="Cinwaanka sawirka">


                <textarea id="desc"
                          placeholder="Qoraalka / Sharaxaadda"></textarea>


                <input type="file"
                       id="file"
                       accept="image/*">


                <button class="upload-btn"
                        onclick="upload()">

                    💾 Save Sawir

                </button>


                <div id="uploadMsg"
                     class="success-msg"></div>


            </div>

        </div>


    </div>


    <!-- ================================================================
         EDIT MODAL
    ================================================================ -->

    <div id="editModal"
         class="edit-modal">


        <div class="edit-modal-content">


            <span class="close-modal"
                  onclick="closeEditModal()">

                &times;

            </span>


            <h2>
                ✏️ Edit Sawir
            </h2>


            <input type="text"
                   id="editTitle"
                   placeholder="Cinwaan">


            <textarea id="editDesc"
                      placeholder="Sharaxaad"></textarea>


            <input type="file"
                   id="editFile"
                   accept="image/*">


            <small>
                Haddii aadan dooran sawir cusub,
                sawirkii hore ayaa sii ahaanaya.
            </small>


            <div class="modal-buttons">


                <button class="save-edit"
                        onclick="saveEdit()">

                    💾 Save

                </button>


                <button class="cancel-edit"
                        onclick="closeEditModal()">

                    Cancel

                </button>


            </div>


            <div id="editMsg"
                 class="success-msg"></div>


        </div>

    </div>


    <!-- ================================================================
         IMAGE PREVIEW
    ================================================================ -->

    <div id="imagePreviewModal"
         class="image-preview-modal">


        <span class="close-preview"
              onclick="closeImagePreview()">

            &times;

        </span>


        <div class="preview-content">


            <img id="previewImage"
                 src=""
                 alt="Sawir">


        </div>


        <div class="preview-info">


            <h3 id="previewTitle">
            </h3>


            <p id="previewDesc">
            </p>


        </div>


    </div>


    <script>


        /* ============================================================
           VARIABLES
        ============================================================ */

        let db = null;

        let isAdmin = false;

        let editingId = null;


        /* ============================================================
           INDEXED DB
        ============================================================ */

        const request =
            indexedDB.open(
                "moolkaalDB",
                1
            );


        request.onupgradeneeded =
            function (event) {

                db =
                    event.target.result;


                if (
                    !db.objectStoreNames.contains(
                        "images"
                    )
                ) {

                    db.createObjectStore(
                        "images",
                        {
                            keyPath: "id",
                            autoIncrement: true
                        }
                    );

                }

            };


        request.onsuccess =
            function (event) {

                db =
                    event.target.result;


                loadImages();

            };


        request.onerror =
            function (event) {

                console.error(
                    "Database Error:",
                    event.target.error
                );

            };


        /* ============================================================
           LOGIN
        ============================================================ */

        function login() {

            const password =
                document.getElementById(
                    "passwordInput"
                ).value;


            if (
                password === "maher123"
            ) {

                isAdmin = true;


                document.getElementById(
                    "loginSection"
                ).style.display =
                    "none";


                document.getElementById(
                    "adminPanel"
                ).style.display =
                    "block";


                loadImages();


            } else {

                alert(
                    "Password-ka waa khalad!"
                );

            }

        }


        /* ============================================================
           LOGOUT
        ============================================================ */

        function logout() {

            isAdmin = false;


            document.getElementById(
                "loginSection"
            ).style.display =
                "block";


            document.getElementById(
                "adminPanel"
            ).style.display =
                "none";


            loadImages();

        }


        /* ============================================================
           UPLOAD
        ============================================================ */

        function upload() {

            const file =
                document.getElementById(
                    "file"
                ).files[0];


            const title =
                document.getElementById(
                    "title"
                ).value.trim();


            const desc =
                document.getElementById(
                    "desc"
                ).value.trim();


            if (
                !file ||
                !title
            ) {

                alert(
                    "Fadlan geli cinwaan iyo sawir."
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {


                    const transaction =
                        db.transaction(
                            "images",
                            "readwrite"
                        );


                    const store =
                        transaction.objectStore(
                            "images"
                        );


                    store.add({

                        title:
                            title,

                        desc:
                            desc,

                        img:
                            event.target.result

                    });


                    transaction.oncomplete =
                        function () {


                            document.getElementById(
                                "title"
                            ).value =
                                "";


                            document.getElementById(
                                "desc"
                            ).value =
                                "";


                            document.getElementById(
                                "file"
                            ).value =
                                "";


                            loadImages();


                            alert(
                                "✅ Sawirka waa la kaydiyey!"
                            );

                        };

                };


            reader.readAsDataURL(
                file
            );

        }


        /* ============================================================
           LOAD IMAGES
        ============================================================ */

        function loadImages() {

            if (!db) {

                return;

            }


            const gallery =
                document.getElementById(
                    "gallery"
                );


            gallery.innerHTML =
                "";


            const transaction =
                db.transaction(
                    "images",
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    "images"
                );


            const request =
                store.openCursor();


            request.onsuccess =
                function (event) {


                    const cursor =
                        event.target.result;


                    if (!cursor) {

                        return;

                    }


                    const data =
                        cursor.value;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";


                    let adminButtons =
                        "";


                    if (isAdmin) {

                        adminButtons = `

                                <div class="admin-buttons">

                                    <button
                                        class="edit-btn"
                                        onclick="event.stopPropagation(); openEditModal(${data.id})"
                                    >
                                        ✏️ Edit
                                    </button>

                                    <button
                                        class="delete-btn"
                                        onclick="event.stopPropagation(); deleteImage(${data.id})"
                                    >
                                        🗑️ Delete
                                    </button>

                                </div>

                            `;

                    }


                    card.innerHTML = `

                            ${adminButtons}

                            <img
                                src="${data.img}"
                                alt="${data.title || "Sawir"}"
                            >

                            <div class="text">

                                <h3>
                                    ${data.title || ""}
                                </h3>

                                <p>
                                    ${data.desc || ""}
                                </p>

                            </div>

                        `;


                    card.addEventListener(
                        "click",
                        function () {

                            openImagePreview(
                                data.id
                            );

                        }
                    );


                    gallery.appendChild(
                        card
                    );


                    cursor.continue();

                };

        }


        /* ============================================================
           DELETE
        ============================================================ */

        function deleteImage(id) {

            if (
                !confirm(
                    "Ma hubtaa inaad tirtirto sawirkan?"
                )
            ) {

                return;

            }


            const transaction =
                db.transaction(
                    "images",
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    "images"
                );


            store.delete(
                id
            );


            transaction.oncomplete =
                function () {

                    loadImages();

                };

        }


        /* ============================================================
           OPEN EDIT
        ============================================================ */

        function openEditModal(id) {

            editingId =
                id;


            const transaction =
                db.transaction(
                    "images",
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    "images"
                );


            const request =
                store.get(
                    id
                );


            request.onsuccess =
                function (event) {


                    const data =
                        event.target.result;


                    if (!data) {

                        return;

                    }


                    document.getElementById(
                        "editTitle"
                    ).value =
                        data.title || "";


                    document.getElementById(
                        "editDesc"
                    ).value =
                        data.desc || "";


                    document.getElementById(
                        "editFile"
                    ).value =
                        "";


                    document.getElementById(
                        "editModal"
                    ).style.display =
                        "block";

                };

        }


        /* ============================================================
           CLOSE EDIT
        ============================================================ */

        function closeEditModal() {

            document.getElementById(
                "editModal"
            ).style.display =
                "none";


            editingId =
                null;

        }


        /* ============================================================
           SAVE EDIT
        ============================================================ */

        function saveEdit() {

            if (
                editingId === null
            ) {

                return;

            }


            const title =
                document.getElementById(
                    "editTitle"
                ).value.trim();


            const desc =
                document.getElementById(
                    "editDesc"
                ).value.trim();


            const newFile =
                document.getElementById(
                    "editFile"
                ).files[0];


            if (!title) {

                alert(
                    "Fadlan geli cinwaan."
                );

                return;

            }


            const transaction =
                db.transaction(
                    "images",
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    "images"
                );


            const request =
                store.get(
                    editingId
                );


            request.onsuccess =
                function (event) {


                    const data =
                        event.target.result;


                    data.title =
                        title;


                    data.desc =
                        desc;


                    if (newFile) {


                        const reader =
                            new FileReader();


                        reader.onload =
                            function (e) {


                                data.img =
                                    e.target.result;


                                store.put(
                                    data
                                );


                                transaction.oncomplete =
                                    function () {

                                        closeEditModal();

                                        loadImages();

                                    };

                            };


                        reader.readAsDataURL(
                            newFile
                        );


                    } else {


                        store.put(
                            data
                        );


                        transaction.oncomplete =
                            function () {

                                closeEditModal();

                                loadImages();

                            };

                    }

                };

        }


        /* ============================================================
           OPEN IMAGE PREVIEW
        ============================================================ */

        function openImagePreview(id) {

            const transaction =
                db.transaction(
                    "images",
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    "images"
                );


            const request =
                store.get(
                    id
                );


            request.onsuccess =
                function (event) {


                    const data =
                        event.target.result;


                    if (!data) {

                        return;

                    }


                    document.getElementById(
                        "previewImage"
                    ).src =
                        data.img;


                    document.getElementById(
                        "previewTitle"
                    ).textContent =
                        data.title || "";


                    document.getElementById(
                        "previewDesc"
                    ).textContent =
                        data.desc || "";


                    document.getElementById(
                        "imagePreviewModal"
                    ).style.display =
                        "block";


                    document.body.style.overflow =
                        "hidden";

                };

        }


        /* ============================================================
           CLOSE IMAGE PREVIEW
        ============================================================ */

        function closeImagePreview() {

            document.getElementById(
                "imagePreviewModal"
            ).style.display =
                "none";


            document.body.style.overflow =
                "auto";

        }


        /* ============================================================
           ENTER LOGIN
        ============================================================ */

        document.getElementById(
            "passwordInput"
        ).addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    login();

                }

            }
        );


        /* ============================================================
           ESC CLOSE
        ============================================================ */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    closeImagePreview();

                    closeEditModal();

                }

            }
        );


    </script>


</body>

</html>
